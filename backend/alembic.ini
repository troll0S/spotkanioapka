[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url jest ustawiany w kodzie (app/migrations.py), żeby ścieżka
# do bazy pochodziła z jednego miejsca — zmiennej DB_PATH.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
# INFO, nie WARNING: migracje biegną przy starcie aplikacji, więc ta sekcja
# ustawia poziom także dla logów aplikacji. WARNING wyciszyłoby wszystko,
# co wypisuje serwer o swoim stanie.
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
